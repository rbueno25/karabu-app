services:
  postgres:
    image: postgres:16-alpine
    container_name: karabu-postgres
    environment:
      POSTGRES_USER: karabu
      POSTGRES_PASSWORD: karabu123
      POSTGRES_DB: karabu
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karabu"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: karabu-backend
    env_file: ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: karabu-frontend
    depends_on:
      - backend
    ports:
      - "3001:80"

volumes:
  pg_data:
